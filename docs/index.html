<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combined Watchlist</title>
  <link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Combined watchlist</h1>
      <p class="muted">Static GitHub Pages view fed from local scraper JSON.</p>
      <div id="updatedAt" class="muted small">Loading data...</div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="toolbar">
      <input id="q" type="search" placeholder="Search title...">
      <select id="source">
        <option value="all">All</option>
        <option value="both">Both</option>
        <option value="letterboxd">Letterboxd only</option>
        <option value="imdb">IMDb only</option>
      </select>
      <select id="genre">
        <option value="all">All genres</option>
      </select>
      <select id="year">
        <option value="all">All years</option>
      </select>
      <button id="resetBtn" type="button">Reset</button>
    </section>
    <section class="sortbar">
      <button id="sortTitleBtn" type="button" class="sortbtn">Name <span id="sortTitleArrow">▲</span></button>
      <button id="sortYearBtn" type="button" class="sortbtn">Year <span id="sortYearArrow">·</span></button>
      <span class="muted small" id="sortHint">Sorting by Name (A-Z)</span>
    </section>

    <section id="grid" class="grid"></section>
    <p id="empty" class="empty hidden">No movies match your filters.</p>
  </main>

  <script src="./app.js?v=2"></script>
</body>
</html>
