<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Watch List</title>
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Our Watch List</h1>
    </header>

    <section class="source-filters">
      <button id="filterLb" class="srcbtn active" data-source="letterboxd">
        <span class="count" id="countLb">0</span> Letterboxd
      </button>
      <button id="filterBoth" class="srcbtn active" data-source="both">
        <span class="count" id="countBoth">0</span> Both
      </button>
      <button id="filterImdb" class="srcbtn active" data-source="imdb">
        <span class="count" id="countImdb">0</span> IMDb
      </button>
    </section>

    <div class="outlinks">
      <a href="https://letterboxd.com/miscalim/watchlist/" target="_blank" class="outlink">View Letterboxd List ↗</a>
      <a href="https://www.imdb.com/user/ur42352318/watchlist/" target="_blank" class="outlink">View IMDb List ↗</a>
    </div>

    <section class="sortbar">
      <button id="sortTitleBtn" type="button" class="sortbtn active">
        Name
        <span class="arrows">
          <span class="arr up active" id="sortTitleUp">▲</span>
          <span class="arr down" id="sortTitleDown">▼</span>
        </span>
      </button>
      <button id="sortYearBtn" type="button" class="sortbtn">
        Year
        <span class="arrows">
          <span class="arr up" id="sortYearUp">▲</span>
          <span class="arr down" id="sortYearDown">▼</span>
        </span>
      </button>
      <button id="sortRatingBtn" type="button" class="sortbtn">
        Rating
        <span class="arrows">
          <span class="arr up" id="sortRatingUp">▲</span>
          <span class="arr down" id="sortRatingDown">▼</span>
        </span>
      </button>
    </section>

    <section id="grid" class="grid"></section>
    <p id="empty" class="empty hidden">No movies match your filters.</p>
  </main>

  <footer class="footer">
    <p id="updatedAt">Loading...</p>
    <p>Made by Stephen Bodie</p>
  </footer>

  <script src="./app.js?v=6"></script>
</body>
</html>
