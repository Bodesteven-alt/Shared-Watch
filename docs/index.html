<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Watch List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=25">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="top-cluster">
        <h1 class="top-title top-title__gradient">Our Watch List</h1>
        <section class="source-filters" id="sourceFiltersRow" aria-label="Filter by list source">
          <button id="filterLb" class="srcbtn active" data-source="letterboxd">
            <span class="count" id="countLb">0</span> Letterboxd
          </button>
          <button id="filterBoth" class="srcbtn active" data-source="both">
            <span class="count" id="countBoth">0</span> Both
          </button>
          <button id="filterImdb" class="srcbtn active" data-source="imdb">
            <span class="count" id="countImdb">0</span> IMDb
          </button>
        </section>
      </div>
    </header>

    <div class="outlinks">
      <a href="https://letterboxd.com/miscalim/watchlist/" target="_blank" class="outlink">View Letterboxd List ↗</a>
      <a href="https://www.imdb.com/user/ur42352318/watchlist/" target="_blank" class="outlink">View IMDb List ↗</a>
    </div>

    <section class="sortbar">
      <button id="sortTitleBtn" type="button" class="sortbtn active">
        Name
        <span class="arrows">
          <span class="arr up active" id="sortTitleUp">▲</span>
          <span class="arr down" id="sortTitleDown">▼</span>
        </span>
      </button>
      <div class="genre-btn-wrap">
        <button id="genreBtn" type="button" class="sortbtn" aria-expanded="false" aria-haspopup="listbox" aria-controls="genrePopup">Genre</button>
        <div id="genrePopup" class="genre-popup hidden" role="listbox" aria-label="Genres"></div>
      </div>
      <button id="sortYearBtn" type="button" class="sortbtn">
        Year
        <span class="arrows">
          <span class="arr up" id="sortYearUp">▲</span>
          <span class="arr down" id="sortYearDown">▼</span>
        </span>
      </button>
      <button id="sortRatingBtn" type="button" class="sortbtn">
        Rating
        <span class="arrows">
          <span class="arr up" id="sortRatingUp">▲</span>
          <span class="arr down" id="sortRatingDown">▼</span>
        </span>
      </button>
    </section>

    <section id="grid" class="grid grid--loading" aria-busy="true" aria-label="Movie list">
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
    </section>
    <p id="empty" class="empty hidden">No movies match your filters.</p>
  </main>

  <footer class="footer">
    <p class="footer-updated" id="updatedAtWrap">
      <span id="updatedDate">Loading…</span>
      <span class="footer-updated__sep" id="updatedSep" hidden> — </span>
      <span id="updatedRel" class="footer-updated__rel" hidden></span>
    </p>
    <p class="footer-tagline">Made with love. By Steven Bode</p>
    <p class="footer-github">
      <a href="https://github.com/Bodesteven-alt/Shared-Watch" target="_blank" rel="noopener noreferrer">View on GitHub</a>
    </p>
  </footer>

  <script>
    (function syncTitleWidthToFilters() {
      var row = document.getElementById("sourceFiltersRow");
      var title = document.querySelector(".top-title");
      var cluster = document.querySelector(".top-cluster");
      if (!row || !title) return;
      function apply() {
        var w = row.offsetWidth;
        var cap = cluster ? cluster.getBoundingClientRect().width : window.innerWidth;
        if (w > 0) title.style.width = Math.min(w, cap) + "px";
      }
      apply();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(apply);
      }
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(apply).observe(row);
        if (cluster) new ResizeObserver(apply).observe(cluster);
      }
      window.addEventListener("resize", apply);
    })();
  </script>
  <script src="./app.js?v=25"></script>
</body>
</html>
