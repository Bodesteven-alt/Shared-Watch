<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
  <main class="wrap">
    <header class="top">
      <div class="top-cluster">
        <h1 class="top-title top-title__gradient">Our Watch List</h1>
        <section class="source-filters" id="sourceFiltersRow" aria-label="Filter by list source">
          <button id="filterLb" class="srcbtn active" data-source="letterboxd" type="button">
            <span class="srcbtn-inner">
              <span class="srcbtn-count" id="srcCountLb">
                <span class="srcbtn-count__total-line">
                  <span class="count srcbtn-count__total" id="countLb">0</span>
                  <span class="srcbtn-count__filtered" id="countLbFiltered" hidden></span>
                </span>
              </span>
              <span class="srcbtn-label">Letterboxd</span>
            </span>
          </button>
          <button id="filterBoth" class="srcbtn active" data-source="both" type="button">
            <span class="srcbtn-inner">
              <span class="srcbtn-count" id="srcCountBoth">
                <span class="srcbtn-count__total-line">
                  <span class="count srcbtn-count__total" id="countBoth">0</span>
                  <span class="srcbtn-count__filtered" id="countBothFiltered" hidden></span>
                </span>
              </span>
              <span class="srcbtn-label">Both</span>
            </span>
          </button>
          <button id="filterImdb" class="srcbtn active" data-source="imdb" type="button">
            <span class="srcbtn-inner">
              <span class="srcbtn-count" id="srcCountImdb">
                <span class="srcbtn-count__total-line">
                  <span class="count srcbtn-count__total" id="countImdb">0</span>
                  <span class="srcbtn-count__filtered" id="countImdbFiltered" hidden></span>
                </span>
              </span>
              <span class="srcbtn-label">IMDb</span>
            </span>
          </button>
        </section>
      </div>
    </header>

    <div class="outlinks">
      <a href="https://letterboxd.com/miscalim/watchlist/" target="_blank" class="outlink">View Letterboxd List ↗</a>
      <a href="https://www.imdb.com/user/ur42352318/watchlist/" target="_blank" class="outlink">View IMDb List ↗</a>
    </div>

    <section class="sortbar">
      <button id="sortRatingBtn" type="button" class="sortbtn">
        Rating
        <span class="arrows">
          <span class="arr up" id="sortRatingUp">▲</span>
          <span class="arr down" id="sortRatingDown">▼</span>
        </span>
      </button>
      <button id="sortTitleBtn" type="button" class="sortbtn active">
        Name
        <span class="arrows">
          <span class="arr up active" id="sortTitleUp">▲</span>
          <span class="arr down" id="sortTitleDown">▼</span>
        </span>
      </button>
      <button id="sortYearBtn" type="button" class="sortbtn">
        Year
        <span class="arrows">
          <span class="arr up" id="sortYearUp">▲</span>
          <span class="arr down" id="sortYearDown">▼</span>
        </span>
      </button>
      <div class="genre-btn-wrap">
        <button id="genreBtn" type="button" class="sortbtn" aria-expanded="false" aria-haspopup="listbox" aria-controls="genreListbox">Genre</button>
        <div id="genrePopup" class="genre-popup hidden"></div>
      </div>
      <div class="services-btn-wrap">
        <button id="servicesBtn" type="button" class="sortbtn" aria-expanded="false" aria-haspopup="dialog" aria-controls="servicesPopup">Services</button>
        <div id="servicesPopup" class="services-popup hidden" role="dialog" aria-label="Streaming services"></div>
      </div>
    </section>

    <section id="grid" class="grid grid--loading" aria-busy="true" aria-label="Movie list">
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
      <article class="card card-skeleton" aria-hidden="true"><div class="card-skeleton__poster"></div><div class="card-skeleton__body"><div class="card-skeleton__line card-skeleton__line--title"></div><div class="card-skeleton__line card-skeleton__line--meta"></div><div class="card-skeleton__row"><span class="card-skeleton__stars"></span><span class="card-skeleton__pill"></span></div></div></article>
    </section>
    <p id="empty" class="empty hidden">No movies match your filters.</p>
  </main>

  <div id="genreSheetBackdrop" class="popup-sheet-backdrop hidden" aria-hidden="true"></div>
  <div id="servicesSheetBackdrop" class="popup-sheet-backdrop hidden" aria-hidden="true"></div>
  <button type="button" id="scrollTopBtn" class="scroll-top-btn" aria-label="Back to top">↑</button>

  <div id="watchBackdrop" class="watch-backdrop" hidden aria-hidden="true"></div>
  <div id="watchPanelHost" class="watch-panel-host" hidden aria-hidden="true"></div>

      </span>
    </p>
  </footer>

  <script>
    (function syncTitleWidthToFilters() {
      var row = document.getElementById("sourceFiltersRow");
      var title = document.querySelector(".top-title");
      var cluster = document.querySelector(".top-cluster");
      if (!row || !title) return;
      function apply() {
        var w = row.offsetWidth;
        var cap = cluster ? cluster.getBoundingClientRect().width : window.innerWidth;
        if (w > 0) title.style.width = Math.min(w, cap) + "px";
      }
      apply();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(apply);
      }
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(apply).observe(row);
        if (cluster) new ResizeObserver(apply).observe(cluster);
      }
      window.addEventListener("resize", apply);
    })();
  </script>
  <script src="./app.js?v=63"></script>
</body>
