<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Watch List</title>
  <link rel="stylesheet" href="./styles.css?v=5">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <h1>Our Watch List</h1>
    </header>

    <div class="stats-toggle-wrap">
      <button id="statsToggle" type="button" class="stats-toggle">Show stats</button>
    </div>
    <section class="stats hidden" id="stats"></section>

    <section class="toolbar">
      <input id="q" type="search" placeholder="Search title...">
      <select id="source">
        <option value="all">All</option>
        <option value="both">Both</option>
        <option value="letterboxd">Letterboxd only</option>
        <option value="imdb">IMDb only</option>
      </select>
      <select id="genre">
        <option value="all">All genres</option>
      </select>
      <button id="resetBtn" type="button">Reset</button>
    </section>
    <section class="sortbar">
      <button id="sortTitleBtn" type="button" class="sortbtn active">
        Name
        <span class="arrows">
          <span class="arr up active" id="sortTitleUp">▲</span>
          <span class="arr down" id="sortTitleDown">▼</span>
        </span>
      </button>
      <button id="sortYearBtn" type="button" class="sortbtn">
        Year
        <span class="arrows">
          <span class="arr up" id="sortYearUp">▲</span>
          <span class="arr down" id="sortYearDown">▼</span>
        </span>
      </button>
      <button id="sortRatingBtn" type="button" class="sortbtn">
        Rating
        <span class="arrows">
          <span class="arr up" id="sortRatingUp">▲</span>
          <span class="arr down" id="sortRatingDown">▼</span>
        </span>
      </button>
    </section>

    <section id="grid" class="grid"></section>
    <p id="empty" class="empty hidden">No movies match your filters.</p>
  </main>

  <footer class="footer">
    <p>Made with love</p>
    <p id="updatedAt" class="muted small">Loading...</p>
  </footer>

  <script src="./app.js?v=5"></script>
</body>
</html>
